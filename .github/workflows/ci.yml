name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Bundles test/analytics.harness.ts with esbuild and runs it under node
      # with chrome.* + fetch stubbed. Never contacts GA4.
      - name: Analytics harness
        run: npm run test:analytics

      # The manifest `key` pins the extension ID to the Web Store item's.
      # Without it an unpacked build gets a path-derived ID and OAuth dies on
      # redirect_uri_mismatch (2026-08-11). Cheap to assert, expensive to
      # rediscover.
      - name: Extension ID is pinned
        run: npm run pin-id -- --verify

      - name: Build
        run: npm run build

      - name: Zip extension
        run: npm run zip

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: dragonsheets-extension
          path: release/*.zip
          if-no-files-found: error
